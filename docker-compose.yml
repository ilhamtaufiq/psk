# Dipakai di Coolify (Docker Compose).
#
# Hanya service `frontend` yang diberi domain publik (psk.cianjur.space, port 4321).
# Service `backend` TIDAK dipublikasikan; frontend memanggilnya lewat jaringan internal
# Docker di http://backend:8080. Dengan begitu tidak perlu CORS dan cookie sesi tetap httpOnly.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - API_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 4321) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=sqlite:///data/app.db
      - UPLOAD_DIR=/data/uploads
      - BIND_ADDR=0.0.0.0:8080
      - RUST_LOG=info
    volumes:
      - psk-data:/data
    healthcheck:
      test: ["CMD", "psk-backend", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  psk-data:
